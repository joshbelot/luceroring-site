<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lucero Ring</title>
<meta name="description" content="Lucero Ring: sleep, energy and stress, kept on your phone.">
<style>
:root{--bg:#F6F3EC;--card:#FFFDF8;--ink:#22201C;--muted:#5F5B53;--line:#E4DED2;--gold:#B87A1E;--star:#E8A33D}
@media (prefers-color-scheme:dark){:root{--bg:#16181D;--card:#1D2026;--ink:#ECE6DA;--muted:#A8A196;--line:#2E323A;--gold:#F2B35E;--star:#F2B35E}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
header{max-width:720px;margin:0 auto;padding:28px 20px 0;display:flex;align-items:center;gap:10px}
header a{color:var(--ink);text-decoration:none;font-weight:600;font-size:18px;display:flex;align-items:center;gap:10px}
nav{margin-left:auto;display:flex;gap:16px;font-size:15px}
nav a{color:var(--muted);font-weight:400;font-size:15px}
main{max-width:720px;margin:0 auto;padding:8px 20px 56px}
h1{font-size:32px;line-height:1.2;margin:28px 0 12px;letter-spacing:-.01em}
h2{font-size:21px;margin:36px 0 8px;padding-top:20px;border-top:1px solid var(--line)}
p,li{color:var(--ink)}
ul,ol{padding-left:22px}
li{margin:6px 0}
a{color:var(--gold)}
code{font:15px ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--card);border:1px solid var(--line);border-radius:5px;padding:1px 5px}
footer{max-width:720px;margin:0 auto;padding:20px 20px 40px;color:var(--muted);font-size:14px;border-top:1px solid var(--line)}
.hero{padding:56px 0 24px}
.hero p{font-size:19px;color:var(--muted);max-width:34em}
.links{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}
.links a{display:inline-block;padding:10px 18px;border:1px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);text-decoration:none;font-size:16px}
</style>
</head>
<body>
<header><a href="/"><svg width="28" height="28" viewBox="0 0 1024 1024" aria-hidden="true"><rect width="1024" height="1024" rx="229" fill="var(--card)" stroke="var(--line)" stroke-width="16"/><g transform="translate(512 548) rotate(-22)"><path d="M 165 -138.6 A 330 160 0 1 1 -165 -138.6" fill="none" stroke="var(--ink)" stroke-width="50" stroke-linecap="round"/><circle cx="0" cy="-160" r="82" fill="var(--star)"/></g></svg>Lucero</a><nav><a href="/support/">Support</a><a href="/privacy/">Privacy</a></nav></header>
<main>
<section class="hero">
<h1>Lucero Ring</h1>
<p>A smart ring and app for sleep, energy and stress. Everything stays on your phone: no account, no subscription, nothing collected.</p>
<div class="links"><a href="/support/">Support</a><a href="/privacy/">Privacy policy</a><a href="mailto:support@luceroring.com">Contact</a></div>
</section>
</main>
<footer>Lucero is made by Josh Belot. © 2026 Josh Belot. <a href="mailto:support@luceroring.com">support@luceroring.com</a></footer>
</body>
</html>
